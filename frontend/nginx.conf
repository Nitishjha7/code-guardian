server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed filenames, so the content at a given URL never changes.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback. index.html must never be cached: it is the only file whose
    # URL stays the same across deploys, so a cached copy keeps pointing at the
    # previous build's hashed assets and the new UI never loads.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Reverse-proxy the API so the browser never needs a CORS preflight
    # and the frontend can ship with VITE_API_URL=/api.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}
