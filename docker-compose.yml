services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      PORT: "8000"
    expose:
      - "8000"
    ports:
      - "8010:8000"
    volumes:
      # Cross-review memory (app/memory/) - a SQLite file, not a service, so
      # a named volume is all persistence needs here. Losing it just means
      # memory starts cold again; nothing in this project depends on it
      # surviving, per app/memory/__init__.py's fail-open design.
      - guardian_memory:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  guardian_memory:
