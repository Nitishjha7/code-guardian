# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Not the live deployment. Production runs on Google Cloud Run so that all three
# portfolio projects share one platform; this blueprint still works and is kept
# as the alternative. See docs/BUILD_AND_DEPLOY.md.
#
# Deploys the single-service image, so API and UI share one URL. No database:
# app/memory/ uses a SQLite file at MEMORY_DB_PATH, which on the free plan sits
# on an ephemeral filesystem and resets on deploy. Memory fails open by design.

services:
  - type: web
    name: code-guardian
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      # Set in the Render dashboard — never commit real values.
      - key: GROQ_API_KEY
        sync: false

      # Groq retires model ids; verify before a demo with
      #   curl https://api.groq.com/openai/v1/models -H "Authorization: Bearer $GROQ_API_KEY"
      # Must support tool calling, which the supervisor depends on.
      - key: GUARDIAN_MODEL
        value: openai/gpt-oss-120b

      # Tried in order if the primary is retired or rate limited. Same-provider,
      # so this covers a dead model id, not a Groq outage.
      - key: GUARDIAN_FALLBACK_MODELS
        value: openai/gpt-oss-20b

      # Same-origin deploy, so no cross-origin caller is expected. Kept narrow
      # rather than "*" because this service holds a GitHub token.
      - key: GUARDIAN_CORS_ORIGINS
        value: https://code-guardian.onrender.com

      # PR bot only. Without them the review UI works and /webhook/github fails
      # closed with a 503.
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
